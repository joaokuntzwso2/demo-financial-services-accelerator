category: Security
name: consentEnforcementPolicy
displayName: Consent Enforcement Policy
version: v1
description: Calls the Financial Services consent validation service before protected resource access.
applicableFlows: [request]
supportedGateways: [Synapse]
supportedApiTypes: [HTTP]
policyAttributes:
