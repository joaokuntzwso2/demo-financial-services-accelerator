openapi: 3.0.3
info: {title: Acme Bank Dynamic Client Registration API, version: 3.3.0}
servers: [{url: https://localhost:8243/open-banking/v3.3/register}]
paths:
  /:
    post:
      summary: Register a TPP client using signed software metadata
      requestBody: {required: true, content: {application/jwt: {schema: {type: string}}}}
      responses: {'201': {description: Client registered}}
    get:
      summary: Read registration
      parameters: [{name: Authorization, in: header, required: true, schema: {type: string}}]
      responses: {'200': {description: Registration}}
    put:
      summary: Update registration
      requestBody: {required: true, content: {application/jwt: {schema: {type: string}}}}
      responses: {'200': {description: Registration updated}}
