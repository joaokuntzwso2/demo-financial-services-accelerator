openapi: 3.0.3
info: {title: Acme Bank Confirmation of Funds API, version: 3.1.0, description: Open Banking-style confirmation of funds demo API.}
servers: [{url: https://localhost:8243/open-banking/v3.1/cbpii}]
paths:
  /funds-confirmation-consents:
    post:
      security: [{OAuth2: [fundsconfirmations]}]
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses: {'201': {description: Consent created}}
  /funds-confirmation-consents/{ConsentId}:
    get:
      security: [{OAuth2: [fundsconfirmations]}]
      parameters: [{name: ConsentId, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Consent}}
  /funds-confirmations:
    post:
      security: [{OAuth2: [fundsconfirmations]}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [AccountId, InstructedAmount]
              properties:
                AccountId: {type: string}
                InstructedAmount:
                  type: object
                  required: [Amount, Currency]
                  properties: {Amount: {type: string}, Currency: {type: string}}
      responses: {'200': {description: Funds availability}}
components:
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://localhost:9446/oauth2/authorize
          tokenUrl: https://localhost:9446/oauth2/token
          scopes: {fundsconfirmations: Confirm funds subject to consent}
