openapi: 3.0.3

info:
  title: Acme Bank Confirmation of Funds API
  version: 3.1.0
  description: Open Banking-style confirmation of funds demo API.

servers:
  - url: https://localhost:8243/open-banking/v3.1/cbpii

paths:
  /funds-confirmation-consents:
    post:
      security:
        - OAuth2: [fundsconfirmations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Consent created

  /funds-confirmation-consents/{ConsentId}:
    get:
      security:
        - OAuth2: [fundsconfirmations]
      parameters:
        - name: ConsentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Consent

  /funds-confirmations:
    post:
      security:
        - OAuth2: [fundsconfirmations]
      parameters:
        - name: x-fapi-interaction-id
          in: header
          required: false
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FundsConfirmation'
      responses:
        '201':
          description: Funds confirmation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FundsConfirmationResponse'

components:
  schemas:
    FundsConfirmation:
      type: object
      required:
        - Data
      properties:
        Data:
          type: object
          required:
            - ConsentId
            - Reference
            - InstructedAmount
          properties:
            ConsentId:
              type: string
              maxLength: 128
            Reference:
              type: string
              maxLength: 35
            InstructedAmount:
              $ref: '#/components/schemas/Amount'

    FundsConfirmationResponse:
      type: object
      required:
        - Data
      properties:
        Data:
          type: object
          required:
            - FundsConfirmationId
            - ConsentId
            - CreationDateTime
            - FundsAvailable
            - Reference
            - InstructedAmount
          properties:
            FundsConfirmationId:
              type: string
              maxLength: 40
            ConsentId:
              type: string
              maxLength: 128
            CreationDateTime:
              type: string
              format: date-time
            FundsAvailable:
              type: boolean
            Reference:
              type: string
              maxLength: 35
            InstructedAmount:
              $ref: '#/components/schemas/Amount'
        Links:
          type: object
          additionalProperties: true
        Meta:
          type: object
          additionalProperties: true

    Amount:
      type: object
      required:
        - Amount
        - Currency
      properties:
        Amount:
          type: string
          pattern: '^\d{1,13}(\.\d{1,5})?$'
        Currency:
          type: string
          pattern: '^[A-Z]{3}$'

  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://localhost:9446/oauth2/authorize
          tokenUrl: https://localhost:9446/oauth2/token
          scopes:
            fundsconfirmations: Confirm funds subject to consent
