name: wso2-openbanking-e2e

services:
  mysql:
    build:
      context: .
      dockerfile: docker/mysql/Dockerfile
    image: wso2-ob-demo-mysql:8.0
    container_name: wso2-ob-mysql
    command:
      - --character-set-server=latin1
      - --collation-server=latin1_bin
      - --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_USER: ${MYSQL_APP_USER:-wso2}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:-wso2}
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-33060}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [obnet]

  bank-backend:
    build:
      context: ./backend
    image: wso2-ob-demo-bank-backend:latest
    container_name: wso2-ob-bank-backend
    environment:
      LISTEN_ADDR: ":8080"
      SEED: "20260827"
      FS_EXTENSION_USER: "fs-extension"
      FS_EXTENSION_PASSWORD: "fs-extension-secret"
      FS_ARI_CERT_FILE: "/run/secrets/wso2is.crt"
      DIRECTORY_CERT_FILE: "/run/secrets/directory.crt"
      TPP_PUBLIC_CERT_FILE: "/run/secrets/tpp.crt"
    volumes:
      - ./.state/certs/wso2is.crt:/run/secrets/wso2is.crt:ro
      - ./.state/certs/directory.crt:/run/secrets/directory.crt:ro
      - ./.state/certs/tpp.crt:/run/secrets/tpp.crt:ro
    ports:
      - "127.0.0.1:${BANK_BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [obnet]

  wso2is:
    build:
      context: .
      dockerfile: docker/is/Dockerfile
      args:
        IS_VERSION: ${IS_VERSION:-7.2.0}
        FS_ACCELERATOR_VERSION: ${FS_ACCELERATOR_VERSION:-4.0.0}
    image: wso2-ob-demo-is:${IS_VERSION:-7.2.0}-fs${FS_ACCELERATOR_VERSION:-4.0.0}
    container_name: wso2-ob-is
    depends_on:
      mysql:
        condition: service_healthy
      bank-backend:
        condition: service_healthy
    environment:
      CONSENT_MANAGER_CLIENT_ID: "${CONSENT_MANAGER_CLIENT_ID:-not-configured}"
      CONSENT_MANAGER_CLIENT_SECRET: "${CONSENT_MANAGER_CLIENT_SECRET:-not-configured}"
      JAVA_OPTS: "-Xms1g -Xmx2g -Djavax.net.ssl.trustStore=/home/wso2carbon/wso2is-${IS_VERSION:-7.2.0}/repository/resources/security/client-truststore.p12 -Djavax.net.ssl.trustStorePassword=wso2carbon -Djavax.net.ssl.trustStoreType=PKCS12"
    ports:
      - "127.0.0.1:${IS_HTTPS_PORT:-9446}:9446"
    healthcheck:
      test: ["CMD-SHELL", "curl -ksSf https://localhost:9446/oauth2/jwks >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      start_period: 120s
      retries: 30
    networks:
      obnet:
        aliases: [wso2is]

  wso2apim:
    build:
      context: .
      dockerfile: docker/apim/Dockerfile
      args:
        APIM_VERSION: ${APIM_VERSION:-4.6.0}
        FS_ACCELERATOR_VERSION: ${FS_ACCELERATOR_VERSION:-4.0.0}
        FS_APIM_MEDIATION_POLICIES_VERSION: ${FS_APIM_MEDIATION_POLICIES_VERSION:-1.0.0}
    image: wso2-ob-demo-apim:${APIM_VERSION:-4.6.0}-fs${FS_ACCELERATOR_VERSION:-4.0.0}
    container_name: wso2-ob-apim
    depends_on:
      wso2is:
        condition: service_healthy
      mysql:
        condition: service_healthy
      bank-backend:
        condition: service_healthy
    environment:
      JAVA_OPTS: "-Xms1g -Xmx3g"
    ports:
      - "127.0.0.1:${APIM_HTTPS_PORT:-9443}:9443"
      - "127.0.0.1:${APIM_GATEWAY_HTTPS_PORT:-8243}:8243"
    healthcheck:
      test: ["CMD-SHELL", "curl -ksSf https://localhost:9443/services/Version >/dev/null || curl -ksSf https://localhost:9443/publisher >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      start_period: 180s
      retries: 40
    networks:
      obnet:
        aliases: [wso2apim]

  bootstrap:
    build:
      context: ./bootstrap
    image: wso2-ob-demo-bootstrap:latest
    container_name: wso2-ob-bootstrap
    profiles: [tools]
    depends_on:
      wso2apim:
        condition: service_healthy
      wso2is:
        condition: service_healthy
    environment:
      APIM_BASE: https://wso2apim:9443
      IS_BASE: https://wso2is:9446
      GATEWAY_BASE: https://wso2apim:8243
      BANK_BACKEND_BASE: http://bank-backend:8080
      WSO2_ADMIN_USER: ${WSO2_ADMIN_USER:-admin}
      WSO2_ADMIN_PASSWORD: ${WSO2_ADMIN_PASSWORD:-admin}
      FS_ACCELERATOR_VERSION: ${FS_ACCELERATOR_VERSION:-4.0.0}
    networks: [obnet]

networks:
  obnet:
    name: wso2-ob-demo-net

volumes:
  mysql_data:
