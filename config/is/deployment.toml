[server]
offset = 3
hostname = "localhost"
internal_hostname = "wso2is"
node_ip = "127.0.0.1"

[super_admin]
username = "admin"
password = "admin"
create_admin_account = true

[keystore.primary]
file_name = "wso2is.p12"
type = "PKCS12"
password = "wso2carbon"
alias = "wso2carbon"
key_password = "wso2carbon"

[truststore]
file_name = "client-truststore.p12"
type = "PKCS12"
password = "wso2carbon"

[database.identity_db]
type = "mysql"
url = "jdbc:mysql://mysql:3306/fs_identitydb?useSSL=false&amp;allowPublicKeyRetrieval=true&amp;serverTimezone=UTC"
username = "wso2"
password = "wso2"
driver = "com.mysql.cj.jdbc.Driver"

[database.shared_db]
type = "mysql"
url = "jdbc:mysql://mysql:3306/fs_iskm_configdb?useSSL=false&amp;allowPublicKeyRetrieval=true&amp;serverTimezone=UTC"
username = "wso2"
password = "wso2"
driver = "com.mysql.cj.jdbc.Driver"

[database.config]
type = "mysql"
url = "jdbc:mysql://mysql:3306/fs_iskm_configdb?useSSL=false&amp;allowPublicKeyRetrieval=true&amp;serverTimezone=UTC"
username = "wso2"
password = "wso2"
driver = "com.mysql.cj.jdbc.Driver"

[database.user]
type = "mysql"
url = "jdbc:mysql://mysql:3306/fs_userdb?useSSL=false&amp;allowPublicKeyRetrieval=true&amp;serverTimezone=UTC"
username = "wso2"
password = "wso2"
driver = "com.mysql.cj.jdbc.Driver"

[[datasource]]
id = "WSO2FS_DB"
url = "jdbc:mysql://mysql:3306/fs_consentdb?useSSL=false&amp;allowPublicKeyRetrieval=true&amp;serverTimezone=UTC"
username = "wso2"
password = "wso2"
driver = "com.mysql.cj.jdbc.Driver"
jndi_name = "jdbc/WSO2FS_DB"
pool_options.maxActive = "80"
pool_options.maxWait = "60000"
pool_options.testOnBorrow = true
pool_options.validationQuery = "SELECT 1"

# APIM 4.6 / IS 7.x Key Manager connector prerequisites.
[oauth]
authorize_all_scopes = true
drop_unregistered_scopes = true

# Financial Services Accelerator 4.0.0 REST resource access rules.
# These are required by the FS IAM accelerator but are not materialized into
# deployment.toml by the accelerator merge.sh process.

[[resource.access_control]]
context = "(.*)/api/fs/consent/admin/(.*)"
http_method = "all"
secure = "true"

[[resource.access_control]]
allowed_auth_handlers = ["BasicAuthentication"]
context = "(.*)/api/fs/consent/(.*)"
http_method = "all"
permissions = ["/permission/admin"]
secure = "true"

[[resource.access_control]]
context = "(.*)/fs/authenticationendpoint/(.*)"
http_method = "all"
secure = "false"

[[resource.access_control]]
allowed_auth_handlers = ["BasicAuthentication"]
context = "(.*)/api/fs/event-notifications/(.*)"
http_method = "all"
permissions = ["/permission/admin"]
secure = "true"

[[resource.access_control]]
context = "(.*)/consentmgr/(.*)"
secure = "false"
http_method = "GET, DELETE"

# Financial Services Accelerator REST resource access rules.
#
# These must be explicitly preserved in the repository overlay because
# resource.access_control is an array-of-tables and the overlay replaces
# the accelerator-provided array during deployment.toml generation.

[[resource.access_control]]
context = "(.*)/api/fs/consent/admin/(.*)"
http_method = "all"
secure = "true"

[[resource.access_control]]
allowed_auth_handlers = ["BasicAuthentication"]
context = "(.*)/api/fs/consent/(.*)"
http_method = "all"
permissions = ["/permission/admin"]
secure = "true"

[[resource.access_control]]
context = "(.*)/fs/authenticationendpoint/(.*)"
http_method = "all"
secure = "false"

[[resource.access_control]]
allowed_auth_handlers = ["BasicAuthentication"]
context = "(.*)/api/fs/event-notifications/(.*)"
http_method = "all"
permissions = ["/permission/admin"]
secure = "true"

[[resource.access_control]]
context = "(.*)/consentmgr/(.*)"
secure = "false"
http_method = "GET, DELETE"

[[resource.access_control]]
context = "(.*)/scim2/Me"
secure = true
http_method = "GET"
cross_tenant = true
permissions = []
scopes = []

[[event_listener]]
id = "token_revocation"
type = "org.wso2.carbon.identity.core.handler.AbstractIdentityHandler"
name = "org.wso2.is.notification.ApimOauthEventInterceptor"
order = 1
[event_listener.properties]
notification_endpoint = "https://wso2apim:9443/internal/data/v1/notify"
username = "admin"
password = "admin"
'header.X-WSO2-KEY-MANAGER' = "WSO2-IS"

[role_mgt]
allow_system_prefix_for_role = true

[transport.https.sslHostConfig.properties]
certificateVerification = "want"

# Used by APIM's IS 7.x connector / tenant sharing over mTLS.
ciphers = "TLS_DHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_DHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384"
[client_certificate_based_authentication]
enable = true
log_client_cert_info = true

[[client_certificate_based_authentication.user_thumbprint_mapping]]
trusted_issuer = "CN=WSO2 Open Banking Demo Root CA, O=WSO2 Demo, C=BR"
cert_thumbprint = "*"
allowed_username = ["admin"]

# Financial Services / Open Banking consent experience.
[authentication.endpoints]
login_url = "https://localhost:9446/authenticationendpoint/login.do"
retry_url = "https://localhost:9446/authenticationendpoint/retry.do"

[authentication.endpoint.redirect_params]
filter_policy = "include"
remove_on_consume_from_api = "true"
parameters = [
    "sessionDataKeyConsent",
    "relyingParty",
    "authenticators",
    "authFailureMsg",
    "authFailure"
]

[oauth.endpoints.v2]
oauth2_consent_page = "https://localhost:9446/fs/authenticationendpoint/oauth2_authz.do"
oidc_consent_page = "https://localhost:9446/fs/authenticationendpoint/oauth2_consent.do"

[financial_services.admin]
username = "admin"
password = "admin"

[financial_services.consent]
is_pre_initiated_consent = true
auth_flow_consent_id_source = "requestObject"

[financial_services.consent.validation]
validator = "org.wso2.financial.services.accelerator.consent.mgt.extensions.validate.impl.DefaultConsentValidator"
signature.alias = "wso2apim"
jwt.payload.enabled = true

[financial_services.consent.portal.params]
identity_server_base_url = "https://localhost:9446"

[financial_services.consent.consent_id_extraction]
json_path = "/id_token/openbanking_intent_id/value"

[financial_services.identity]
consent_id_claim_name = "consent_id"
append_consent_id_to_access_token = true
append_consent_id_to_authz_id_token = true

[financial_services.http_connection_pool]
max_connections = 200
max_connections_per_route = 100
connection_timeout = 20000
socket_timeout = 20000

[application_mgt]
enable_role_validation = true

# Demo-friendly Open Banking DCR setup. For production, point SSA/JWKS to the trusted directory.
[oauth.dcr]
ssa_jwks = "http://bank-backend:8080/directory/jwks.json"

enable_fapi_enforcement = true
[oauth.oidc.fapi]
enable_security_profile = true
enable_ciba_profile = false
allowed_client_authentication_methods = ["private_key_jwt", "tls_client_auth"]
allowed_signature_algorithms = ["PS256", "ES256"]

[oauth.oidc.id_token]
signature_algorithm = "PS256"

[oauth.oidc.token_endpoint]
signing_algorithms = ["PS256", "ES256"]

[oauth.oidc.user_info]
jwt_signature_algorithm = "PS256"
# Financial Services Accelerator OAuth authorization/token handlers.
#
# FS 4.0.0 requires these handlers so the consent identifier is carried
# internally from authorization into the authorization-code/token flow.
[oauth.response_type]
code.enable = false

[[oauth.custom_response_type]]
name = "code"
class = "org.wso2.financial.services.accelerator.identity.extensions.auth.extensions.response.handler.FSCodeResponseTypeHandlerExtension"

[[oauth.custom_response_type]]
name = "code id_token"
class = "org.wso2.financial.services.accelerator.identity.extensions.auth.extensions.response.handler.FSHybridResponseTypeHandlerExtension"

[oauth.grant_type.authorization_code]
enable = true
grant_handler = "org.wso2.financial.services.accelerator.identity.extensions.grant.type.handlers.FSAuthorizationCodeGrantHandler"

[oauth.grant_type.refresh_token]
enable = true
grant_handler = "org.wso2.financial.services.accelerator.identity.extensions.grant.type.handlers.FSRefreshGrantHandler"

# Demo bank integration for the Financial Services consent authorization page.
# The stock FS Accelerator 4.0.0 DefaultConsentRetrievalStep supplies two
# hard-coded dummy accounts. Keep that step for its consent/state validation,
# then replace the screen data with real demo-bank accounts through the
# supported OpenAPI service-extension mechanism.
[financial_services.extensions.endpoint]
enabled = true
allowed_extensions = ["populate_consent_authorize_screen"]
base_url = "http://bank-backend:8080/extensions"
retry_count = 3
connect_timeout = 5
read_timeout = 5

[financial_services.extensions.endpoint.security]
type = "Basic-Auth"
username = "fs-extension"
password = "fs-extension-secret"

[[financial_services.consent.authorize_steps.retrieve]]
class = "org.wso2.financial.services.accelerator.consent.mgt.extensions.authorize.impl.DefaultConsentRetrievalStep"
priority = 1

[[financial_services.consent.authorize_steps.retrieve]]
class = "org.wso2.financial.services.accelerator.consent.mgt.extensions.authorize.impl.ExternalAPIConsentRetrievalStep"
priority = 2
